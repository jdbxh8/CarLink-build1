
name: Build CarLink 1.0.8 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source parts
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "platforms;android-37" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;29.0.14206865" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Reassemble source ZIP
        run: |
          set -euo pipefail
          test -f CarLink-source.part-0
          test -f CarLink-source.part-1
          test -f CarLink-source.part-2
          cat CarLink-source.part-0 CarLink-source.part-1 CarLink-source.part-2 > CarLink-1.0.8-enhanced-source.zip
          unzip -tq CarLink-1.0.8-enhanced-source.zip
          mkdir source
          unzip -q CarLink-1.0.8-enhanced-source.zip -d source
          test -f source/CarLink-1.0.8-enhanced/gradlew

      - name: Check resources
        working-directory: source/CarLink-1.0.8-enhanced
        run: python3 scripts/resource_collisions.py --check

      - name: Build debug APK
        working-directory: source/CarLink-1.0.8-enhanced
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarLink-1.0.8-debug-apk
          path: source/CarLink-1.0.8-enhanced/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
